<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPDB Suara AI - SDN Ranca Tales</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 550px; margin: 30px auto; padding: 20px; background-color: #f1f5f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        h2 { margin-bottom: 5px; color: #1e293b; }
        p.sub { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .btn-main-mic { width: 90px; height: 90px; border-radius: 50%; border: none; background-color: #2563eb; color: white; font-size: 36px; cursor: pointer; transition: all 0.3s; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .btn-main-mic.listening { background-color: #dc2626; animation: pulse 1.2s infinite; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
        #status-text { font-weight: bold; color: #475569; margin-bottom: 20px; min-height: 20px; }
        .preview-box { text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; }
        .preview-box h4 { margin-top: 0; color: #334155; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .preview-item { font-size: 14px; margin: 5px 0; color: #334155; }
        .preview-item span { font-weight: bold; color: #0f172a; }
        .btn-submit { background-color: #16a34a; color: white; width: 100%; font-weight: bold; margin-top: 20px; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; display: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ PPDB Suara Pintar (AI)</h2>
    <p class="sub">SDN Ranca Tales</p>
    
    <!-- HANYA SATU TOMBOL MIKROFON UTAMA -->
    <button type="button" id="micUtama" class="btn-main-mic" onclick="toggleDikte()">🎙️</button>
    <div id="status-text">Klik tombol untuk mulai bicara...</div>
    
    <!-- KOTAK PRATINJAU HASIL ANALISIS AI -->
    <div id="previewBox" class="preview-box">
        <h4>🔍 Hasil Analisis Data (Mohon Dicek):</h4>
        <div id="dataHasil"></div>
        <button type="button" id="btnKirim" class="btn-submit" onclick="kirimKeSpreadsheet()">💾 COCOK, SIMPAN DATA</button>
    </div>
</div>

<script>
    // =========================================================================
    // CONFIGURATION (URL DAN API KEY SUDAH TERPASANG DAN SIAP PAKAI)
    // =========================================================================
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbyrv0asRbF8L7GDyDGZ92vH-ZiaGdc0KQeUk0dfqF5YbrevXeHd5mnYRxrnH75cG-Dm/exec"; 
    const GROQ_API_KEY = "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";
    // =========================================================================

    let recognition;
    let isListening = false;
    let dataTerpilih = null;

    function toggleDikte() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { return alert("Browser tidak mendukung sensor suara."); }

        const btn = document.getElementById('micUtama');
        const status = document.getElementById('status-text');

        if (!isListening) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btn.classList.add('listening');
                status.innerText = "🔴 Mendengarkan... Sebutkan data murid sekaligus!";
            };

            recognition.onend = () => {
                isListening = false;
                btn.classList.remove('listening');
            };

            recognition.onresult = async (event) => {
                const teksSuara = event.results[0][0].transcript;
                status.innerText = "🤖 Sedang diproses AI, mohon tunggu...";
                await prosesDenganAI(teksSuara);
            };

            recognition.start();
        } else {
            recognition.stop();
        }
    }

    // FUNGSI UTAMA: AI MEMILAH TEKS SUARA MENJADI KOLOM-KOLOM
    async function prosesDenganAI(teks) {
        const prompt = `Kamu adalah sistem PPDB sekolah. Ekstrak teks pendaftaran berikut ke dalam format JSON murni. 
        Teks: "${teks}"
        Format JSON wajib memiliki key: noDaftar, nama, nik, tempatLahir, tglLahir, ayah, ibu, alamat, pilihanTK, namaTK, jarak. 
        Ketentuan nilai:
        - pilihanTK hanya berisi "Ya" atau "Tidak".
        - Jika ada kolom yang tidak disebutkan dalam teks, isi dengan "".
        - Berikan hasil HANYA objek JSON saja, tanpa penjelasan kata-kata tambahan apapun.`;

        try {
            const respon = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.1
                })
            });

            const hasilJson = await respon.json();
            const teksMentah = hasilJson.choices[0].message.content.trim();
            dataTerpilih = JSON.parse(teksMentah);

            // Tampilkan hasil analisis ke layar agar bapak bisa cek ulang sebelum disimpan
            let htmlData = "";
            const labels = {
                noDaftar: "No Daftar", nama: "Nama Murid", nik: "NIK", 
                tempatLahir: "Tempat Lahir", tglLahir: "Tgl Lahir", 
                ayah: "Nama Ayah", ibu: "Nama Ibu", alamat: "Alamat", 
                pilihanTK: "Pilihan TK", namaTK: "Nama TK", jarak: "Jarak (Km)"
            };

            for (let key in dataTerpilih) {
                htmlData += `<div class="preview-item"><span>${labels[key] || key}:</span> ${dataTerpilih[key]}</div>`;
            }

            document.getElementById('dataHasil').innerHTML = htmlData;
            document.getElementById('previewBox').style.display = "block";
            document.getElementById('btnKirim').style.display = "block";
            document.getElementById('status-text').innerText = "✨ Selesai dianalisis!";

        } catch (err) {
            alert("Gagal memproses suara lewat AI: " + err);
            document.getElementById('status-text').innerText = "Gagal memproses.";
        }
    }

    // KIRIM HASIL KE GOOGLE SPREADSHEET BAPAK
    function kirimKeSpreadsheet() {
        const btnKirim = document.getElementById('btnKirim');
        btnKirim.innerText = "Mengirim ke Google Sheets...";
        btnKirim.disabled = true;

        fetch(URL_WEB_APP, {
            method: "POST",
            body: JSON.stringify(dataTerpilih)
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "sukses") {
                alert("Data berhasil masuk ke Spreadsheet baris " + data.baris);
                document.getElementById('previewBox').style.display = "none";
                document.getElementById('status-text').innerText = "Klik tombol untuk mulai bicara...";
            } else {
                alert("Gagal kirim: " + data.error);
            }
        })
        .catch(err => alert("Eror jaringan: " + err))
        .finally(() => {
            btnKirim.innerText = "💾 COCOK, SIMPAN DATA";
            btnKirim.disabled = false;
        });
    }
</script>
</body>
</html>
